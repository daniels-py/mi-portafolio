<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Patas (4 pares articulados estilo 8-bit) -->
  <g fill="#3f3f46">
    <!-- Par 1 (arriba) -->
    <rect x="2" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/>
    <rect x="1" y="3" width="1" height="2"/>
    <rect x="13" y="2" width="1" height="1"/><rect x="12" y="3" width="1" height="1"/>
    <rect x="14" y="3" width="1" height="2"/>

    <!-- Par 2 (medio superior) -->
    <rect x="2" y="5" width="2" height="1"/>
    <rect x="1" y="6" width="1" height="1"/><rect x="0" y="7" width="1" height="1"/>
    <rect x="12" y="5" width="2" height="1"/>
    <rect x="14" y="6" width="1" height="1"/><rect x="15" y="7" width="1" height="1"/>

    <!-- Par 3 (medio inferior) -->
    <rect x="3" y="7" width="1" height="1"/><rect x="2" y="8" width="1" height="1"/>
    <rect x="1" y="9" width="1" height="3"/>
    <rect x="12" y="7" width="1" height="1"/><rect x="13" y="8" width="1" height="1"/>
    <rect x="14" y="9" width="1" height="3"/>

    <!-- Par 4 (abajo) -->
    <rect x="4" y="9" width="1" height="1"/><rect x="3" y="10" width="1" height="2"/>
    <rect x="2" y="12" width="1" height="2"/>
    <rect x="11" y="9" width="1" height="1"/><rect x="12" y="10" width="1" height="2"/>
    <rect x="13" y="12" width="1" height="2"/>
  </g>

  <!-- Cuerpo / Abdomen -->
  <g fill="#27272a">
    <rect x="6" y="2" width="4" height="1"/>
    <rect x="5" y="3" width="6" height="1"/>
    <rect x="4" y="4" width="8" height="2"/>
    <rect x="5" y="6" width="6" height="5"/>
  </g>

  <!-- Brillo sutil en el caparazón -->
  <g fill="#52525b">
    <rect x="6" y="3" width="2" height="1"/>
    <rect x="5" y="4" width="2" height="1"/>
  </g>

  <!-- Ojos rojos estilo arcade -->
  <g fill="#ef4444">
    <rect x="5" y="8" width="2" height="1"/>
    <rect x="9" y="8" width="2" height="1"/>
  </g>
  <g fill="#fca5a5">
    <rect x="5" y="8" width="1" height="1"/>
    <rect x="9" y="8" width="1" height="1"/>
  </g>

  <!-- Colmillos -->
  <g fill="#e4e4e7">
    <rect x="6" y="11" width="1" height="1"/>
    <rect x="9" y="11" width="1" height="1"/>
  </g>
</svg>
